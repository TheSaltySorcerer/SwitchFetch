# See https://github.com/dylanaraps/neofetch/wiki/Customizing-Info
nx_thermal_temp() {
    local zone type value fallback="$1"
    shift
    for zone in /sys/class/thermal/thermal_zone*; do
        [[ -r "$zone/type" && -r "$zone/temp" ]] || continue
        IFS= read -r type < "$zone/type" || continue
        case "${type,,}" in
            *cpu*therm*|*therm*cpu*|*gpu*therm*|*therm*gpu*)
                case "${type,,}" in
                    *"$1"*) value=$(<"$zone/temp"); printf '%.1f °C' "$(awk -v t="$value" 'BEGIN { print t / 1000 }')"; return ;;
                esac
                ;;
        esac
    done
    zone="/sys/class/thermal/thermal_zone${fallback}"
    if [[ -r "$zone/temp" ]]; then
        value=$(<"$zone/temp")
        awk -v t="$value" 'BEGIN { printf "%.1f °C", t / 1000 }'
    else
        printf 'N/A'
    fi
}

nx_battery_info() {
    local battery capacity status
    for battery in /sys/class/power_supply/*; do
        [[ -r "$battery/capacity" ]] || continue
        capacity=$(<"$battery/capacity")
        status=''
        [[ -r "$battery/status" ]] && status=$(<"$battery/status")
        if [[ -n "$status" ]]; then printf '%s%% · %s' "$capacity" "$status"; else printf '%s%%' "$capacity"; fi
        return
    done
    printf 'N/A'
}

print_info() {
    info title
    info underline

    info "OS" distro
    prin "Board" "Tegra X1 · NX"
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "CPU" cpu
    prin "GPU" "NVIDIA GM20B · Maxwell"
    info "Memory" memory
    info "Disk" disk
    prin "CPU Temp" "$(nx_thermal_temp 1 cpu)"
    prin "GPU Temp" "$(nx_thermal_temp 2 gpu)"
    prin "Battery" "$(nx_battery_info)"
    info cols
}

# Cyan labels, white values, and a muted separator.
colors=(33 255 240 33 244 255)

# Inline thermal and storage bars.
cpu_display="infobar"
memory_display="infobar"
disk_display="infobar"
battery_display="infobar"
cpu_temp="off"

# Custom NX-Fetch-derived icon, using c1/c2/c3 color tokens.
image_backend="ascii"
image_source="${XDG_CONFIG_HOME:-$HOME/.config}/neofetch/nx-ascii"
ascii_colors=(33 196 7 7 7 7)
ascii_bold="on"
color_blocks="on"
